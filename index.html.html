<style>
/* 🎨 ألوان الصفحة (لافندر) */
:root{--bg:#F8F5FD;--surface:#FFFFFF;--ink:#2A2144;--muted:#6A6285;--line:#E6DFF3;--accent:#7B5CD6;--b2:#D9C8FF;--b3:#FFD6E0;

<header class="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
 <div class="wrap"><h1 id="name"></h1><div class="role"><span id="roleText"></span> <em id="rot"></em></div><p id="intro"></p>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const mot=!matchMedia("(prefers-reduced-motion:reduce)").matches;
const li=a=>a.map(x=>`<li>${x}</li>`).join("");
let LANG='en';

function getPath(obj,path){
  return path.split('.').reduce((o,k)=>{
    if(o&&typeof o==='object'&&k in o)return o[k];
    return undefined;
  },obj);
}

function setLang(lang){
  LANG=lang;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  try{localStorage.setItem('nouf-portfolio-lang',lang);}catch(e){}
  $("#langEN").classList.toggle('on',lang==='en');
  $("#langAR").classList.toggle('on',lang==='ar');
  document.title=getPath(SITE.name,lang)+' – Portfolio';
  $("#nm").textContent=getPath(SITE.name,lang);

  // data-i18n
  $$('[data-i18n]').forEach(el=>{
    const v=getPath(SITE,el.getAttribute('data-i18n'));
    if(v)el.textContent=getPath(v,lang);
  });

  // name (letter by letter for EN, word by word for AR)
  const n=$("#name");n.innerHTML="";
  const nm=getPath(SITE.name,lang);
  if(lang==='ar'){
    // قسّمي بالكلمات للعربي
    nm.split(' ').forEach((w,i)=>{
      const s=document.createElement("span");
      s.textContent=w;
      s.style.animationDelay=i*200+"ms";
      s.style.display="inline-block";
      n.append(s);
      if(i<nm.split(' ').length-1) n.append(document.createTextNode("\u00A0"));
    });
  } else {
    // حرف حرف للإنجليزي
    [...nm].forEach((c,i)=>{
      const s=document.createElement("span");
      s.textContent=c==" "?"\u00A0":c;
      s.style.animationDelay=i*50+"ms";
      n.append(s);
    });
  }

  // role
  $("#roleText").textContent=lang==='ar'?"أحوّل البيانات إلى":"I turn data into";

  // intro, about, contact line
  $("#intro").textContent=getPath(SITE.intro,lang);
  $("#about").textContent=getPath(SITE.about,lang);
  $("#cl").textContent=getPath(SITE.contactLine,lang);
  $("#ft").textContent="© "+new Date().getFullYear()+" "+getPath(SITE.name,lang)+(SITE.location?" · "+getPath(SITE.location,lang):"");

  // rotating words
  const words=getPath(SITE.words,lang);
  const r=$("#rot");let wi=0;r.textContent=words[0];
  if(window._rotInt)clearInterval(window._rotInt);
  if(mot&&words.length>1){
    window._rotInt=setInterval(()=>{
      r.classList.add("out");
      setTimeout(()=>{r.textContent=words[++wi%words.length];r.classList.remove("out")},400);
    },2600);
  }

  // skills
  $("#sk").innerHTML=getPath(SITE.skills,lang).map(x=>`<div class="rv"><h3>${x.t}</h3><p class="chips">${x.items.split(", ").map(i=>`<span>${i}</span>`).join("")}</p></div>`).join("");

  // education
  $("#ed").innerHTML=getPath(SITE.education,lang).map(x=>`<div class="rv"><div><h3>${x.t}</h3><p>${x.s}</p></div><time>${x.d}</time></div>`).join("");

  // certificates
  $("#ce").innerHTML=getPath(SITE.certificates,lang).map(x=>`<div class="rv"><div><h3>${x.t}</h3><p>${x.s}</p></div><time>${x.d}</time></div>`).join("");

  // training
  $("#tr").innerHTML=getPath(SITE.training,lang).map(x=>`<div class="rv"><div><h3>${x.t}</h3><p>${x.s}</p></div><time>${x.d}</time></div>`).join("");

  // contact buttons
  // contact buttons
  $("#cb").innerHTML=[
    [SITE.email,"https://mail.google.com/mail/?view=cm&to="+SITE.email+"&su=Portfolio%20Inquiry",1],
    ["LinkedIn",SITE.linkedin],
    ["GitHub",SITE.github],
    [{en:"CV", ar:" السيرة الذاتية"}, "Nouf_Alharbi_Resume.pdf"]
  ].filter(x=>x[1]&&x[0]).map(x=>`<a class="btn${x[2]?" p":""}" href="${x[1]}" target="_blank" rel="noopener">${getPath(x[0],lang)||x[0]}</a>`).join("");

  // projects
  window._full=SITE.projects.map(p=>{
    const tag=getPath(p.tag,lang),meta=getPath(p.meta,lang),problem=getPath(p.problem,lang),
          built=getPath(p.built,lang),result=getPath(p.result,lang),takeaway=getPath(p.takeaway,lang),
          stats=getPath(p.stats,lang);
    return `<section class="proj" style="--c:${p.color}"><div class="wrap"><div class="txt rv"><div class="meta">${meta}</div><h3>${p.name}</h3><p class="tag">${tag}</p>
<h4>${getPath(SITE.ui.problemLabel,lang)}</h4><p>${problem}</p>
<h4>${getPath(SITE.ui.builtLabel,lang)}</h4><ul>${li(built)}</ul>
<h4>${getPath(SITE.ui.resultLabel,lang)}</h4><ul>${li(result)}</ul>
<div class="pstats">${stats.map(s=>`<div><strong>${s.v}</strong><span>${s.l}</span></div>`).join("")}</div></div>
<div class="shots">${p.shots.map(s=>`<figure class="shot rv"><div class="bar"><i></i><i></i><i></i></div>${s.src?`<img src="${s.src}" alt="${getPath(s.cap,lang)}" loading="lazy">`:`<div class="ph"><b>${getPath(SITE.ui.addShot,lang)}</b><span>${getPath(s.cap,lang)}</span></div>`}<figcaption>${getPath(s.cap,lang)}</figcaption></figure>`).join("")}</div>
<div class="txt rv">
<div class="proj-actions">${p.links.filter(l=>l.url && !l.url.toLowerCase().includes('github.com')).map(l=>`<a class="lnk${l.primary?" primary":""}" href="${l.url}" target="_blank" rel="noopener">${getPath(l.label,lang)} ↗</a>`).join("")}</div>
<div class="takeaway"><b>${getPath(SITE.ui.takeawayLabel,lang)}:</b> ${takeaway}</div>
<div class="chips">${p.stack.map(s=>`<span>${s}</span>`).join("")}</div></div></div></section>`;
  });
  renderCards(lang);

  // re-observe for animation
  document.querySelectorAll(".rv").forEach(e=>io.observe(e));
}

// IntersectionObserver once
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
}),{threshold:.12});

// hover 3D on shots
if(mot){
  document.addEventListener('mousemove',e=>{
    const el=e.target.closest('.shot');
    if(el){
      const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;
      el.style.transform=`perspective(900px) rotateY(${x*4}deg) rotateX(${-y*4}deg)`;
    }
  },true);
  document.addEventListener('mouseout',e=>{
    const el=e.target.closest('.shot');
    if(el)el.style.transform="";
  },true);
}

// project cards + details popup
function renderCards(lang){
  $("#list").innerHTML=SITE.projects.map((p,i)=>{
    const st=getPath(p.stats,lang)[0];
    
    // كود يبحث عن رابط GitHub
    const ghLink = p.links.find(l => l.url && l.url.toLowerCase().includes('github.com'));
    const ghBtn = ghLink ? `<a href="${ghLink.url}" target="_blank" rel="noopener" class="btn-github" onclick="event.stopPropagation()">GitHub ↗</a>` : ``;

    // كود عرض أول 3 مهارات + الرقم المتبقي
    const maxChips = 3;
    const displayStack = p.stack.slice(0, maxChips).map(s=>`<span>${s}</span>`).join("");
    const remainingCount = p.stack.length - maxChips;
    const moreChip = remainingCount > 0 ? `<span class="more-chips">+${remainingCount}</span>` : "";

    return `<button class="card rv" style="--c:${p.color}" onclick="openProj(${i})">
      <div class="meta">${getPath(p.meta,lang)}</div>
      <h3>${p.name}</h3>
      <p>${getPath(p.tag,lang)}</p>
      <div><div class="big">${st.v}</div><p style="font-size:14px; margin-top:4px; text-align:start;">${st.l}</p></div>
      
      <div class="chips">${displayStack}${moreChip}</div>
      
      <div class="card-actions">
        ${ghBtn}
        <span class="go">${getPath(SITE.ui.viewDetails,lang)}</span>
      </div>
    </button>`;
  }).join("");
}
function openProj(i){
  const d=$("#dlg");
  d.innerHTML=`<button class="x" onclick="$('#dlg').close()" aria-label="${getPath(SITE.ui.close,LANG)}">✕</button>`+window._full[i];
  d.scrollTop=0;d.showModal();document.body.classList.add("lock");
}
$("#dlg").addEventListener("close",()=>document.body.classList.remove("lock"));
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

(function(){
  let saved='en';
  try{saved=localStorage.getItem('nouf-portfolio-lang')||'en';}catch(e){}
  setLang(saved);
})();

// Lightbox للصور
function openLightbox(src){
  const lb=$("#lightbox");
  $("#lightbox-img").src=src;
  lb.showModal();
}
function closeLightbox(e){
  if(e && e.target.id !== 'lightbox' && !e.target.classList.contains('close-lb')) return;
  $("#lightbox").close();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$("#lightbox").open)closeLightbox();
});
document.addEventListener('click',e=>{
  const img=e.target.closest('.shot img');
  if(img&&!img.src.includes('placeholder')){
    e.preventDefault();
    openLightbox(img.src);
  }
});
</script>
</body>
</html>
